# Keeps the SHA-pinned GitHub Actions and the npm dependencies current. Review each update: for
# actions, check that the new SHA belongs to the tagged release in the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # The Next.js version is a support decision (ADR-0011), not an automatic update.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # Types follow the lowest supported runtime (engines: node >=22), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
