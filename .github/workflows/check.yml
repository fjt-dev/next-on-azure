name: check

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job needs more. Never switch this workflow to pull_request_target.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  check:
    name: lint, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # pnpm is installed from npm at the version pinned in package.json ("packageManager"), so the
      # version lives in one place and no third-party action is involved.
      - name: Install pnpm
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: bash scripts/ci/pnpm-install.sh --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Azurite)
        run: pnpm test:integration

      - name: Bicep compiles
        run: az bicep build --file packages/next-on-azure/infra/main.bicep --stdout > /dev/null

  supply-chain:
    name: audit, secrets, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: bash scripts/ci/pnpm-install.sh --frozen-lockfile

      # Production dependencies must have no known high or critical advisory. Development tools are
      # reported but do not fail the build (see docs/contribute/supply_chain.md).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies (report only)
        run: pnpm audit || true

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      - name: License allow-list
        run: node scripts/license-check.mjs

      - name: Links between the Markdown files
        run: node scripts/check-links.mjs

  e2e:
    # The HTTP suite against the Next.js server running in the Functions host, with Azurite. Next.js 15
    # (the catalog version) and the lowest 16.x.
    name: local E2E (Functions host + Azurite, Next.js ${{ matrix.next }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        next: [catalog, "16.4.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        if: matrix.next == 'catalog'
        run: bash scripts/ci/pnpm-install.sh --frozen-lockfile

      - name: Install dependencies with Next.js ${{ matrix.next }}
        if: matrix.next != 'catalog'
        env:
          NEXT_VERSION: ${{ matrix.next }}
        run: |
          sed -i "s/^  next: .*/  next: ${NEXT_VERSION}/" pnpm-workspace.yaml
          bash scripts/ci/pnpm-install.sh --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm e2e:standalone
        env:
          LOCAL_STACK_LOG_DIR: ${{ runner.temp }}/standalone-logs

      - name: Upload host logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-logs-next-${{ matrix.next }}
          path: ${{ runner.temp }}/standalone-logs
          if-no-files-found: ignore
          retention-days: 7

  install:
    # The packed package installed the way a user does it (npm, Yarn 1) into a clean project, built,
    # packaged and run on the Functions host with Azurite: the pnpm workspace link hides layout problems.
    name: install test (${{ matrix.manager }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, yarn]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: bash scripts/ci/pnpm-install.sh --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install, build, package and test
        run: node scripts/install-test.mjs ${{ matrix.manager }}
        env:
          LOCAL_STACK_LOG_DIR: ${{ runner.temp }}/install-logs

      - name: Upload host logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-${{ matrix.manager }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/install-logs
          if-no-files-found: ignore
          retention-days: 7
