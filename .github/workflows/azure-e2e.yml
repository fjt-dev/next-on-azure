name: azure-e2e

# Deploys the example app to a real Azure subscription, runs the end-to-end tests against the
# deployed URL and deletes everything. It creates billable resources: see docs/contribute/azure_runs.md.
# Never runs for pull requests, so code from forks cannot reach the Azure identity.
on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region
        default: japaneast
        required: true
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC; only runs when the variable AZURE_E2E_SCHEDULED is "true"

permissions:
  contents: read

concurrency:
  group: azure-e2e
  cancel-in-progress: false

env:
  CI: "true"
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
  RESOURCE_GROUP: rg-oe2e-${{ github.run_id }}-${{ github.run_attempt }}
  LOCATION: ${{ inputs.location || 'japaneast' }}

jobs:
  e2e:
    name: deploy, test, delete
    # Only main: the federated credential accepts nothing else, and a branch cannot change the rule.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AZURE_E2E_SCHEDULED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the hard time window; the cleanup job below still runs after it
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package the example
        run: |
          pnpm build
          pnpm --filter example-app-router run openbuild
          pnpm --filter example-app-router run package

      - name: Sign in to Azure (OIDC)
        run: scripts/ci/azure-login.sh

      - name: Create the resource group
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none \
            --tags purpose=opennextjs-azure-e2e "createdAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" "runId=${{ github.run_id }}"
          echo "created resource group $RESOURCE_GROUP in $LOCATION"

      - name: Deploy
        working-directory: examples/app-router
        run: |
          # Five-second polling keeps the ISR checks short; the name is unique per run.
          # main.bicep limits the name to 12 characters: "oe" + 8 digits + the attempt number.
          name="oe$(printf '%s' "${{ github.run_id }}" | tail -c 8)${{ github.run_attempt }}"
          node ../../packages/open-next-azure/dist/cli/index.js deploy \
            -g "$RESOURCE_GROUP" -n "$name" \
            --deployer-principal-id "$AZURE_PRINCIPAL_ID" --deployer-principal-type ServicePrincipal \
            --revalidation-polling-seconds 5 \
            --output-file "$RUNNER_TEMP/deployment.json"
          cat "$RUNNER_TEMP/deployment.json"

      - name: Wait until the app answers
        run: |
          url="$(jq -r .url "$RUNNER_TEMP/deployment.json")"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 -o /dev/null "$url/"; then echo "up after $i attempt(s)"; exit 0; fi
            sleep 10
          done
          echo "the app did not answer within 5 minutes" >&2
          exit 1

      - name: End-to-end tests against the deployment
        run: E2E_BASE_URL="$(jq -r .url "$RUNNER_TEMP/deployment.json")" pnpm --filter tests-e2e run e2e:remote

      - name: Delete the resource group
        if: always()
        run: az group delete --name "$RESOURCE_GROUP" --yes --no-wait || true

  cleanup:
    # Safety net: runs even when the job above timed out, was cancelled or lost its runner. Deletes
    # this run's group and any group of this workflow older than three hours.
    name: make sure nothing is left
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure (OIDC)
        run: scripts/ci/azure-login.sh

      - name: Delete this run's group and stale ones
        run: |
          cutoff="$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          # ISO timestamps compare correctly as strings; JMESPath cannot compare strings.
          az group list --tag purpose=opennextjs-azure-e2e \
            --query "[].[name, tags.createdAt]" --output tsv |
            while IFS=$'\t' read -r group created; do
              [ -n "$group" ] || continue
              if [ "$group" = "$RESOURCE_GROUP" ] || [[ "$created" < "$cutoff" ]]; then
                echo "deleting $group"
                az group delete --name "$group" --yes --no-wait
              fi
            done
          echo "remaining groups of this workflow:"
          az group list --tag purpose=opennextjs-azure-e2e --query "[].name" --output tsv
