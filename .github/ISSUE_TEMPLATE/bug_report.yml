name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue: use **Report a vulnerability** in the Security tab (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal Next.js app, or the page and request that fails.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: next-on-azure (commit), Next.js, Node.js, package manager
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [On Azure, Locally (Azurite and the Functions host), Both, Not sure]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The Functions host log or the Application Insights traces. Remove secrets and personal data first.
      render: text
